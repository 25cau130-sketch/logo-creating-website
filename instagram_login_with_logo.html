<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: white;
            border: 1px solid #dbdbdb;
            padding: 20px 40px;
            width: 350px;
            box-sizing: border-box;
        }
        
        .logo-container {
            margin: 22px auto 12px;
            width: 175px;
            height: 51px;
            position: relative;
        }
        
        .instagram-logo {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);
            border-radius: 20%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 30px;
            font-weight: bold;
            font-style: italic;
        }
        
        .logo-text {
            margin-top: 10px;
            font-size: 24px;
            font-weight: 300;
            color: #262626;
        }
        
        .form-container {
            width: 100%;
        }
        
        .input-field {
            width: 100%;
            margin-bottom: 6px;
            padding: 9px 8px 7px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 12px;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #a8a8a8;
        }
        
        .login-button {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 9px;
            font-weight: 600;
            margin-top: 8px;
            cursor: pointer;
        }
        
        .login-button:disabled {
            background-color: rgba(0, 149, 246, 0.3);
            cursor: default;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 10px 0 18px;
            color: #8e8e8e;
            font-size: 13px;
        }
        
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #dbdbdb;
        }
        
        .divider::before {
            margin-right: 12px;
        }
        
        .divider::after {
            margin-left: 12px;
        }
        
        .facebook-login {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            color: #385185;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .facebook-login i {
            margin-right: 8px;
            font-size: 16px;
        }
        
        .forgot-password {
            font-size: 12px;
            color: #00376b;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .signup-container {
            background-color: white;
            border: 1px solid #dbdbdb;
            padding: 20px 0;
            text-align: center;
            width: 350px;
            margin-top: 10px;
        }
        
        .signup-text {
            font-size: 14px;
        }
        
        .signup-link {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
        }
        
        .get-app {
            margin-top: 20px;
            text-align: center;
        }
        
        .app-stores {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }
        
        .app-store-img {
            height: 40px;
        }
        
        @media (max-width: 400px) {
            .container, .signup-container {
                width: 90%;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="instagram-logo">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#gradient)"/>
                    <path d="M 20 20 L 80 20 L 80 40 L 60 40 L 60 60 L 80 60 L 80 80 L 20 80 L 20 60 L 40 60 L 40 40 L 20 40 Z" fill="white" stroke="white" stroke-width="2"/>
                    <circle cx="85" cy="15" r="4" fill="white"/>
                    <path d="M 50 30 L 50 70 M 30 50 L 70 50" stroke="white" stroke-width="3"/>
                </svg>
            </div>
        </div>
        
        <div class="logo-text">Instagram</div>
        
        <form class="form-container" id="loginForm">
            <input type="text" class="input-field" placeholder="Phone number, username, or email" required>
            <input type="password" class="input-field" placeholder="Password" required>
            <button type="submit" class="login-button" id="loginButton">Log In</button>
        </form>
        
        <div class="divider">
            <span>OR</span>
        </div>
        
        <div class="facebook-login">
            <i class="fab fa-facebook-square"></i>
            <span>Log in with Facebook</span>
        </div>
        
        <div class="forgot-password">
            <a href="#" style="color: #00376b; text-decoration: none;">Forgot password?</a>
        </div>
    </div>
    
    <div class="signup-container">
        <p class="signup-text">Don't have an account? <a href="#" class="signup-link">Sign up</a></p>
    </div>
    
    <div class="get-app">
        <p>Get the app.</p>
        <div class="app-stores">
            <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_ios_english-en.png/180ae7a0bcf7.png" alt="Download on the App Store" class="app-store-img">
            <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_android_english-en.png/e9cd846dc748.png" alt="Get it on Google Play" class="app-store-img">
        </div>
    </div>
    
    <svg style="display: none;">
        <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#f09433;"/>
                <stop offset="25%" style="stop-color:#e6683c;"/>
                <stop offset="50%" style="stop-color:#dc2743;"/>
                <stop offset="75%" style="stop-color:#cc2366;"/>
                <stop offset="100%" style="stop-color:#bc1888;"/>
            </linearGradient>
        </defs>
    </svg>
    
    <script>
        // Form validation
        const form = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const inputs = form.querySelectorAll('input');
        
        // Check if all fields are filled
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                const allFilled = Array.from(inputs).every(input => input.value.trim() !== '');
                loginButton.disabled = !allFilled;
            });
        });
        
        // Form submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // In a real application, you would send the data to a server
            const username = inputs[0].value;
            const password = inputs[1].value;
            
            console.log('Login attempt:', { username, password });
            
            // Show success message
            alert('Login functionality would be implemented here. This is a demo interface.');
            
            // Reset form
            form.reset();
            loginButton.disabled = true;
        });
        
        // Facebook login
        document.querySelector('.facebook-login').addEventListener('click', () => {
            alert('Facebook login integration would be implemented here.');
        });
        
        // Sign up link
        document.querySelector('.signup-link').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Sign up functionality would be implemented here.');
        });
        
        // Forgot password
        document.querySelector('.forgot-password a').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Password reset functionality would be implemented here.');
        });
    </script>
</body>
</html>
