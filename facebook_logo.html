<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Logo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }
        
        .logo-container {
            text-align: center;
        }
        
        .facebook-logo {
            width: 300px;
            height: 300px;
            background-color: #1877f2;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .logo-text {
            color: white;
            font-size: 80px;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            letter-spacing: 2px;
        }
        
        .logo-description {
            margin-top: 30px;
            color: #65676b;
            font-size: 18px;
        }
        
        @media (max-width: 600px) {
            .facebook-logo {
                width: 200px;
                height: 200px;
            }
            
            .logo-text {
                font-size: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="facebook-logo">
            <div class="logo-text">f</div>
        </div>
        <div class="logo-description">
            Facebook Logo - Social Media Platform
        </div>
    </div>
</body>
</html>
